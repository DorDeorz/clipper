# clipper config. Copy to config.yaml and edit. Relative paths are resolved
# against this file's directory.
paths: { data_dir: ./data, ffmpeg: ffmpeg, ffprobe: ffprobe }
panel: { host: 127.0.0.1, port: 8765 }
# anonymous: no accounts/API keys needed for monitoring (default)
# official:  Twitch Helix / YouTube Data API fallback (needs keys in .env)
monitoring: { mode: anonymous }
recorder:
  buffer_minutes: 15
  quality: "1080p60,1080p,936p60,720p60,best"
detector:
  bin_seconds: 1
  burst_window: 5
  baseline_halflife: 300
  warmup_seconds: 180
  threshold: 3.0
  min_rate: 0.5
  min_ratio: 1.6
  cooldown: 45
  lag_seconds: 20
  pre_roll: 40
  post_roll: 25
  weights: { rate: 0.40, uniq: 0.25, emote: 0.20, audio: 0.15 }
transcribe: { model: large-v3, device: auto, compute_type: auto, language: tr, beam_size: 5 }
live_transcribe:           # r3: live transcript (content path)
  enabled: true
  model: large-v3-turbo    # speed first live; "small" without a GPU
  chunk_seconds: 20
  overlap_seconds: 4
  beam_size: 1
content_scan:              # r3: content path
  enabled: true
  model: claude-haiku-5-5
  every_seconds: 60
  window_seconds: 90
  min_score: 70            # above this the window becomes a candidate
  skip_if_silent_ratio: 0.7
events:                    # r3: platform event filter
  suppress_after_sub_train: 20
  suppress_threshold_boost: 1.5
  raid_suppress_seconds: 60
viewer_clips:
  enabled: true
  as_candidate: true
  bonus: 1.5
llm:
  prefilter_model: claude-haiku-5-5
  judge_model: claude-sonnet-5-5     # premium: claude-opus-5-5
  max_candidates_per_hour: 12
  min_keep_score: 65
  # Harcama sınırları (USD, UTC ay/gün). Dolunca hiçbir Claude isteği gönderilmez.
  monthly_budget_usd: 30
  daily_budget_usd: 3
  # Aylık bütçenin bu oranından sonra judge ucuz modele (Haiku) düşer.
  downgrade_at: 0.8
render:
  width: 1080
  height: 1920
  fps: 30
  encoder: auto            # auto | h264_nvenc | libx264
  loudness_lufs: -14
  min_len: 12
  max_len: 59
publish:
  min_gap_minutes: { youtube: 90, instagram: 120, x: 60, tiktok: 120 }
  daily_cap: { youtube: 8, instagram: 6, x: 10, tiktok: 6 }
  auto_publish_min_score: 85
  cross_platform_gap_minutes: 15   # aynı klip platformlar arasında bu arayla
  youtube_privacy: unlisted        # public | unlisted | private
  graph_api_version: v25.0         # Instagram (Facebook Login for Business)
  tiktok_mode: inbox               # inbox | direct (direct için audit gerekir)
  tiktok_audit_passed: false       # sadece TikTok audit'i geçtiyse true yap
streamers: []
