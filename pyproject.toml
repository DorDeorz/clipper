[project]
name = "clipper"
version = "0.1.0"
description = "Streamer clip automation: chat-driven highlight detection, vertical render, publishing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "cryptography>=42",
    "httpx>=0.27",
    "numpy>=2.0",
]

[project.scripts]
clipper = "clipper.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not online'"
markers = [
    "online: tests that need real network access (run with -m online)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
