[project]
name = "clipper"
version = "0.1.0"
description = "Streamer clip automation: chat-driven highlight detection, vertical render, publishing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "cryptography>=42",
    "httpx>=0.27",
    "numpy>=2.0",
    "anthropic>=2.10.0",
    "faster-whisper>=1.2.1",
    # faster-whisper 1.2.1 calls av.open(..., metadata_errors=...), removed in PyAV 19.
    "av>=11,<19",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'linux' or sys_platform == 'win32'",
]

[project.scripts]
clipper = "clipper.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not online and not claude_live'"
markers = [
    "online: tests that need real network access (run with -m online)",
    "claude_live: PAID real Anthropic API smoke tests (run with -m claude_live -s)",
    "slow: long-running tests (skip with -m 'not slow')",
    "integration: multi-component tests against local fake servers",
    "security: security checks (TESTPLAN 8.2)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.uv]
# NVIDIA CUDA wheels: only pick versions that also ship win_amd64 builds.
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]
